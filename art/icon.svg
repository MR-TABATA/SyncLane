<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- SyncLane アプリアイコン(大サイズ用・.icns / README / LP のマスター)。scripts/make-icons.py が作る。直すときはそちらを直す。
       フクシアのタイル(SyncVey と同じ配色の仲間: コーラル #FF8A3D)に、吹き出しが左・右・左と交互に並び、中央を細いレーンが縦に通る。
       Sync(やり取り)と Lane(レーン=時間軸)が 1 つの形に入る。尾は突き出さず、レーン側の下の角だけ小さい丸みにした。
       旧案(円形の同期矢印)は、Replacicon と、重なる 2 つの吹き出しは Lotus Chat と、形が近かったので外した(2026-10-19)。
       **カンバスいっぱいに描かないこと。** macOS のアプリアイコンは 1024px のうち角丸本体が 824px(= 80.47%)で、周囲に余白と落ち影を持つ。 -->
  <defs><linearGradient id="fuchsia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DA3DB9"/><stop offset="1" stop-color="#A01C88"/></linearGradient><radialGradient id="gloss" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="55%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#0B1020" flood-opacity="0.30"/></filter></defs>
  <g filter="url(#shadow)">
    <g transform="translate(9.765 9.765) scale(0.8047)">
      <rect width="100" height="100" rx="23" fill="url(#fuchsia)"/><rect width="100" height="100" rx="23" fill="url(#gloss)"/>
      <path d="M50 17 V83" stroke="#FF8A3D" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="50" cy="26" r="3" fill="#FFFFFF" stroke="#FF8A3D" stroke-width="2.2"/><circle cx="50" cy="50" r="3" fill="#FFFFFF" stroke="#FF8A3D" stroke-width="2.2"/><circle cx="50" cy="74" r="3" fill="#FFFFFF" stroke="#FF8A3D" stroke-width="2.2"/><path d="M21 17.0 H36 a6 6 0 0 1 6 6 V33.2 a1.8 1.8 0 0 1 -1.8 1.8 H21 a6 6 0 0 1 -6 -6 V23.0 a6 6 0 0 1 6 -6Z" fill="#FFFFFF"/><path d="M64 41.0 H79 a6 6 0 0 1 6 6 V53.0 a6 6 0 0 1 -6 6 H59.8 a1.8 1.8 0 0 1 -1.8 -1.8 V47.0 a6 6 0 0 1 6 -6Z" fill="#FF8A3D"/><path d="M21 65.0 H36 a6 6 0 0 1 6 6 V81.2 a1.8 1.8 0 0 1 -1.8 1.8 H21 a6 6 0 0 1 -6 -6 V71.0 a6 6 0 0 1 6 -6Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
