<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- SyncLane アプリアイコン(大サイズ用・.icns / README / LP のマスター)。
       旧名 MrVoie / MrCairn のアイコン(フクシアのタイル + ドットの V)は、2026-10-15 に差し替えた。
       SyncLane は Mr シリーズではなく独自名なので、SyncVey と同じ配色(インディゴ #C2269F + コーラル #FF8A3D)にした。

       グリフは「同期の矢印の道」。円形の同期矢印(🔄)を太い道にして、中央にコーラルの点線を通した。Sync(矢印)と Lane(道)が 1 つの形に入る。
       決め手: 絵文字のメモ(🔄 🔀 🔁 + レーン)から、R1・R2・R4 を 128 / 64 / 32 / 16px で比べて R1 を選んだ。
       縦の波線は、1 本だと波平の髪、並べるとラーメンに見えたので外した。

       **カンバスいっぱいに描かないこと。** macOS のアプリアイコンは 1024px のうち
       角丸本体が 824px(= 80.47%)で、周囲に余白と落ち影を持つ。 -->
