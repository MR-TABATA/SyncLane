<!doctype html>
<meta charset="utf-8">
<title>OnlyFans サービス説明</title>
<!-- 実際の ChatGPT の画面の構造（2026-10 に確認）を真似た試験用のページ。
     ブラウザで開くと、extract.js の結果が下に出る。期待どおりなら「OK」。 -->
<body>
<script src="../extract.js"></script>
<script>
  // 実画面の構造: 3 ページ分が DOM に残り、今見ているのは active-page="true" の 1 つだけ
  function turn(conv, key, userId, userText, userAt, asstId, asstText) {
    const t = document.createElement("div");
    t.setAttribute("data-turn-key", key);
    t.innerHTML =
      (userAt ? `<div role="separator"><time datetime="${userAt}"><span>日付</span></time></div>` : "") +
      `<div><h4>あなたの発言:</h4>
         <div data-chatgpt-search-unit-key="fallback-turn-0:0:user" data-chatgpt-search-message-ids="${userId}">
           <div data-content-search-unit-key="fallback-turn-0:0:user"><div><div class="whitespace-pre-wrap">${userText}</div></div></div>
         </div></div>
       <div><span hidden></span>
         <div data-chatgpt-search-unit-key="fallback-turn-0:1:assistant" data-chatgpt-search-message-ids="${asstId}">
           <h4 data-conversation-role="assistant">ChatGPT の発言:</h4>
           <div><div data-chatgpt-selection-conversation-id="${conv}" data-chatgpt-selection-message-id="${asstId}"><p>${asstText}</p></div></div>
         </div></div>
       <div><button aria-label="コピーする"></button></div>`;
    return t;
  }
  const CONV = "6a028271-e50c-8320-b519-0035cb794fcc";
  function page(active, conv, turns) {
    const p = document.createElement("div");
    p.setAttribute("data-app-shell-active-page", active ? "true" : "false");
    turns.forEach((t) => p.appendChild(turn(conv, ...t)));
    document.body.appendChild(p);
  }
  page(false, "aaaaaaaa-0000-0000-0000-000000000001", [["k1", "u-x1", "裏の質問1", null, "a-x1", "裏の答え1"]]);
  page(false, "aaaaaaaa-0000-0000-0000-000000000002", [["k2", "u-x2", "裏の質問2", null, "a-x2", "裏の答え2"]]);
  page(true, CONV, [
    ["k3", "u-1", "質問1", "2026-05-12T01:29:15.635Z", "a-1", "答え1"],
    ["k4", "u-2", "質問2", null, "a-2", "答え2"],
  ]);

  const E = window.SyncLaneExtract;
  const c = E.conversation(document, { hostname: "chatgpt.com", pathname: "/c/" + CONV });
  const expected = [
    { role: "user", text: "質問1", id: "u-1", at: "2026-05-12T01:29:15.635Z" },
    { role: "assistant", text: "答え1", id: "a-1", at: undefined },
    { role: "user", text: "質問2", id: "u-2", at: undefined },
    { role: "assistant", text: "答え2", id: "a-2", at: undefined },
  ];
  const got = c && c.messages.map((m) => ({ role: m.role, text: m.text, id: m.id, at: m.at }));
  const ok = c && c.source === "chatgpt_web" && c.conversation_id === CONV && c.title === "OnlyFans サービス説明" &&
    JSON.stringify(got) === JSON.stringify(expected);
  const pre = document.createElement("pre");
  pre.id = "result";
  pre.textContent = (ok ? "OK" : "NG") + "\n" + JSON.stringify(c, null, 1);
  document.body.prepend(pre);
</script>
