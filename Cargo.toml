[package]
name = "mrvoie"
version = "0.1.0"
edition = "2024"
description = "MrVoie: a local-first journal for AI-assisted work history"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

